name: Publish the next pick

# Render's free tier stops the API after about 15 minutes without traffic, and the
# scheduler runs inside that service, so it stops too. Left alone, slots pass
# unfilled and a new pick only appears when a person happens to visit -- which is
# exactly what happened between 13 and 22 September 2026.
#
# This is the knock on the door. Hitting /hourly wakes the service and fills the
# current slot on the way through, and waking it also starts a full cycle
# (ingest, score, record outcomes) inside the API.
#
# Cron is UTC and ONE's slots follow New York, so both halves of the year are
# listed: 04/10/16/22 UTC during daylight saving, 05/11/17/23 UTC in winter. The
# four extra calls each day are free -- filling a slot that is already filled does
# nothing at all.
#
# GitHub may run a scheduled job a few minutes late when it is busy. For a pick
# every six hours that is invisible.

on:
  schedule:
    - cron: "5 4,5,10,11,16,17,22,23 * * *"
  workflow_dispatch:

concurrency:
  group: publish-slots
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Override in the repo's Settings -> Secrets and variables -> Variables
      API: ${{ vars.ONE_API_URL || 'https://one-api-lcrh.onrender.com' }}
    steps:
      - name: Wake the API and fill the current slot
        run: |
          for attempt in 1 2 3; do
            # A sleeping free instance takes ~50 seconds to come back
            if curl -fsS --max-time 120 "$API/hourly" -o hourly.json; then
              jq -r '"Now showing: \(.candidate.title // "nothing yet") (\(.hourly.publish_time // "-"))"' hourly.json
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          echo "::error::The API did not answer after three attempts."
          exit 1

      - name: Check the slot actually filled
        run: |
          curl -fsS --max-time 90 "$API/status" -o status.json
          jq -r '"slot filled: \(.schedule.current_slot_filled) | latest: \(.schedule.latest_publish_time) \(.schedule.latest_title) | ready: \(.content.ready_to_feature) | scored last cycle: \(.pipeline.scored)"' status.json
          if [ "$(jq -r '.schedule.current_slot_filled' status.json)" != "true" ]; then
            echo "::error::The current slot is still empty. Check ready_to_feature and pipeline.last_score_problem at $API/status"
            jq -r '.pipeline' status.json
            exit 1
          fi
